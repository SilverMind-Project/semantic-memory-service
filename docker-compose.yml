version: '3.8'

services:
  semantic-memory-db:
    image: ankane/pgvector:latest
    container_name: semantic-memory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

  semantic-memory-service:
    build: .
    container_name: semantic-memory-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@semantic-memory-db:5432/semantic_memory
    ports:
      - "8300:8300"
    depends_on:
      semantic-memory-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
