# Semantic Memory Service — Docker Compose
#
# Prerequisites:
#   - Shared PostgreSQL:  cd ../db && docker compose up -d
#   - Triton Inference Server (for embedding model)

services:
  semantic-memory-service:
    build: .
    container_name: semantic-memory-service
    networks:
      - nanai
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${SMS_DB_USER:?err}:${SMS_DB_PASSWORD:?err}@postgres:5432/semantic_memory"
    ports:
      - "8400:8400"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  nanai:
    name: nanai
    external: true
