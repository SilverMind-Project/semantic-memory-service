# Semantic Memory Service — Docker Compose
#
# PostgreSQL is provided by the shared ../docker-compose.db.yml (included below).

include:
  - ../docker-compose.db.yml

services:
  semantic-memory-service:
    build: .
    container_name: semantic-memory-service
    networks:
      - nanai
    environment:
      DATABASE_URL: postgresql://${SMS_DB_USER:-sms_user}:${SMS_DB_PASSWORD:?err}@postgres:5432/semantic_memory
    ports:
      - "8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  nanai:
    name: nanai
    external: true
