[project]
name = "semantic-memory-service"
version = "0.1.0"
description = "Semantic memory microservice for scene intelligence"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "AAIF", email = "ai@aaif.org"}
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
