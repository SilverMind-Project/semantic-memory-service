[project]
name = "semantic-memory-service"
version = "0.1.0"
description = "Semantic memory service for storing and retrieving observations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "alembic>=1.18.4",
    "triton-shared @ git+https://github.com/SilverMind-Project/triton-shared",
    "tritonclient[all]>=2.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
# Settings live here rather than on the command line so the CLI, an editor, and
# CI all agree. check_untyped_defs is on because the codebase already passes it;
# without it mypy silently skips the body of every unannotated function.
python_version = "3.14"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
